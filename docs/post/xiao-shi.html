  <div class="post-meta">
    <time datetime="2025-02-18">2025-02-18</time>

    <span>约 1 分钟</span>
<a class="tag" style="--tc: #72FDF4" href="https://timeleaper128.hubingsf.cn/tag/诗.html">诗</a>  </div>

  <div class="prose">
<p>我遇到了一个人<br>
他给我看他的房子<br>
房子里有他的宝物<br>
他的思想和他的歌<br>
他爱这房子<br>
爱这思想，他的歌<br>
我在心里划一块地<br>
也盖上了他爱的房子<br>
铺着他的思想<br>
放着他的歌</p>
<p>后来<br>
他和我挥手再见<br>
终究是再也不见</p>
<p>而我路过我的心<br>
那里有着他的房子<br>
他的思想和他的歌<br>
永远耸立<br>
永远年轻<br>
永远播放</p>
  </div>
