  <div class="prose">
<p>我们的群被封掉了</p>
<p>我们被随意侮辱<br>
我们被虚拟传唤<br>
我们什么也不是<br>
我们是垃圾，是残次品<br>
因为我们有意见</p>
<p>我们被随意侮辱<br>
我们被脱光衣服<br>
我们什么也不是<br>
我们是罪犯，是两脚羊<br>
因为我们有意见</p>
<p>只要城市在运转<br>
只要地上无尸体<br>
只要眼前无血迹<br>
我们的意见并不重要</p>
<p>随意摧毁<br>
随意粉饰<br>
随意宣扬<br>
随意太平</p>
<p>我们被随便侮辱<br>
因为我们有意见<br>
我们什么都不是<br>
我们的意见并不重要</p>
  </div>
