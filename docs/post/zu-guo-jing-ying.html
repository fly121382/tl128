  <h1 class="post-title">祖国精英</h1>
  <div class="post-meta">
    <time datetime="2023-11-08">2023-11-08</time>
    <span>144 字</span>
    <span>约 1 分钟</span>
<a class="tag" href="https://fly121382.github.io/tl128/tag/诗.html">诗</a>  </div>

  <div class="prose">
<p>祖国精英，尽职尽责<br>
建起了一条管道<br>
流出的是她的生命<br>
流进的是她的回报</p>
<p>祖国权威，予取予夺<br>
升起了一面旗帜<br>
旗帜上是光环荣耀<br>
旗帜下是寂静亡魂</p>
<p>她的痛从内转移到外<br>
他的人从内转移到外<br>
她的心依旧渴望光明<br>
而他们正在代表光明</p>
<p>她向往着的<br>
将她拒绝<br>
她憧憬着的<br>
将她打碎<br>
她忍受着的<br>
将万千的她</p>
<p>浇上冷水<br>
将希波克拉底誓言<br>
烧作了土</p>
  </div>
